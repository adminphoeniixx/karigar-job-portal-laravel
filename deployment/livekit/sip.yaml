# LiveKit's SIP bridge — the piece that turns a room into a phone call.
#
# Only needed once the Plivo trunk exists. Until then the whole self-hosted
# stack runs fine without this service.
#
# Plivo authenticates the trunk by **username and password**, not by IP, so
# nothing here has to be whitelisted on their side and this server's public IP
# can change without breaking the line. The credentials live on the LiveKit
# outbound trunk (see docs/ai-screening-calls.md), not in this file.
#
# Screening calls are outbound only: this service dials out to Plivo's
# termination domain over TLS and Plivo sends the audio back. The ports below
# are what *we* listen on — the RTP range carries every call's audio, and
# sip_port matters only on the day we start accepting inbound calls too.

# api_key and api_secret are deliberately absent. They used to be written here
# as ${LIVEKIT_API_KEY} / ${LIVEKIT_API_SECRET}, but this file is read as plain
# YAML — nothing expands a shell placeholder in it — so the service
# authenticated with the literal string "${LIVEKIT_API_KEY}" and every call
# died at join with `unauthorized: invalid API key: ${LIVEKIT_API_KEY}`, long
# after the trunk and the dial had worked. The service reads both from its
# environment, which docker-compose already passes.

# 127.0.0.1, not `livekit`. This service runs on the host network — the audio
# it carries is what pushed the whole stack off docker's bridge — and there is
# no per-compose DNS there to resolve a service name with. Same for redis.
ws_url: ws://127.0.0.1:7880

redis:
  address: 127.0.0.1:6399

# The SIP standard port, and LiveKit's own default. Unused while we only dial
# out; Plivo's origination URI would point here (";transport=tcp") if we ever
# take calls in.
sip_port: 5060
# Voice itself flows over these. One call uses two ports.
#
# Kept *below* the kernel's ephemeral range (`net.ipv4.ip_local_port_range`,
# 32768-60999 by default) for the same reason livekit.yaml is: a range that
# overlaps it can find a port already held by an unrelated socket, and the bind
# fails intermittently with "address already in use".
rtp_port: 10000-10200

use_external_ip: true

logging:
  level: info
  json: true
