# Self-hosted LiveKit for the AI screening calls.
#
# This is now the deployment, not an alternative to LiveKit Cloud. The carrier
# decides it: Exotel's SIP trunk authenticates by IP only — no username/password
# — and LiveKit Cloud has no static IP to give it. This server does.
#
# Read docs/ai-screening-calls.md#self-hosting first. The catch that shaped the
# config below: LiveKit *Inference* does not serve a self-hosted server (it 401s
# on a self-hosted room id), so every vendor is called with our own key.
#
#   docker compose -f deployment/livekit/docker-compose.livekit.yml up -d
#
# On easypanel, add these as a compose service and open the ports listed below
# on the VPS firewall — they are UDP, so the HTTP proxy will not do it for you.

services:
  # State shared between the media server and the SIP bridge.
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    environment:
      # "key: secret" — generate the secret yourself, minimum 32 characters.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"          # signalling (websocket) — put TLS in front of this
      - "7881:7881"          # RTC over TCP, the fallback when UDP is blocked
      - "20000-20200:20000-20200/udp"  # the actual audio — see livekit.yaml
    depends_on:
      - redis
    restart: unless-stopped

  # The phone line. Ports here are Exotel's, not LiveKit's defaults: their vSIP
  # trunk signals over SIP/TCP on 5070 and sends media on RTP 10000-40000. A
  # different carrier will want different ones — change sip.yaml to match.
  sip:
    image: livekit/sip:latest
    command: --config /etc/sip.yaml
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    volumes:
      - ./sip.yaml:/etc/sip.yaml:ro
    ports:
      - "5070:5070/tcp"                  # Exotel signals here — TCP, not UDP
      - "10000-40000:10000-40000/udp"    # call audio
    depends_on:
      - livekit
    restart: unless-stopped

  # The voice itself. Same image whether LiveKit is self-hosted or cloud — only
  # LIVEKIT_URL changes.
  agent:
    build:
      context: ../../services/screening-agent
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_AGENT_NAME: screening-agent
      SCREENING_WEBHOOK_URL: ${SCREENING_WEBHOOK_URL}
      SCREENING_WEBHOOK_SECRET: ${SCREENING_WEBHOOK_SECRET}
      # Self-hosted has no inference gateway: every vendor is called directly
      # with our own key.
      SCREENING_SPEECH: plugins
      # Speech in and speech out both on Inworld — one account, one key, and the
      # cloned Hindi voice the script is tuned for. INWORLD_API_KEY is what
      # authenticates both; without it the container starts and has no voice.
      SCREENING_STT: ${SCREENING_STT:-inworld/inworld-stt-1}
      SCREENING_TTS: ${SCREENING_TTS:-inworld/inworld-tts-1.5-max}
      INWORLD_API_KEY: ${INWORLD_API_KEY:-}
      # Sarvam is the A/B on Hindi, and also serves the LLM below.
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      # Deepgram/Cartesia are the alternative pair; set the two models above to
      # deepgram/nova-3 and cartesia/sonic-3 and fill these in instead.
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
      # Sarvam, on the key above — DigitalOcean's Llama answers 403 now and the
      # llama3.3 id was retired. The "conversations" variant, not plain
      # sarvam-105b, which returns its reasoning instead of an answer.
      SCREENING_LLM: ${SCREENING_LLM:-openai/sarvam-105b-conversations}
      SCREENING_LLM_BASE_URL: ${AI_BASE_URL:-https://api.sarvam.ai/v1}
      SCREENING_LLM_API_KEY: ${AI_KEY:-}
    depends_on:
      - livekit
    restart: unless-stopped
