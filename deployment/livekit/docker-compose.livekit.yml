# Self-hosted LiveKit for the AI screening calls.
#
# This is the deployment, not an alternative to LiveKit Cloud. It started as
# the carrier's doing — Exotel's SIP trunk authenticates by IP only, and
# LiveKit Cloud has no static IP to give it — and it stays our choice now that
# the carrier is Plivo, which authenticates by username and password and would
# have run on Cloud just as well. Self-hosted keeps the media on our own
# server, which is also what India's media-anchoring rule wants.
#
# Read docs/ai-screening-calls.md#self-hosting first. The catch that shaped the
# config below: LiveKit *Inference* does not serve a self-hosted server (it 401s
# on a self-hosted room id), so every vendor is called with our own key.
#
#   docker compose -f deployment/livekit/docker-compose.livekit.yml up -d
#
# Every service here runs on `network_mode: host`, which is not the usual
# default and is worth understanding before changing it back.
#
# Docker's normal bridge networking gives each container its own namespace and
# reaches it through `ports:`, and every published port gets a `docker-proxy`
# process that copies each packet through userland. For HTTP that is invisible.
# Call audio is RTP — fifty small UDP packets a second, each way, per call —
# and relaying those through userland adds jitter and drops, which is what made
# the screening voice sound like it was breaking up. Host networking puts the
# media straight on the host NIC, as if the services had been installed with
# apt, and is what LiveKit recommends for a single VPS.
#
# Two consequences, both of which will bite if forgotten:
#
#   1. Service names no longer resolve. There is no per-compose DNS on the host
#      network, so everything below talks to 127.0.0.1 rather than to `redis`
#      or `livekit`. Changing a service back to bridge networking means
#      changing those addresses back too — in livekit.yaml and sip.yaml as well
#      as here.
#
#   2. The firewall now applies. Published ports bypass ufw by writing their
#      own iptables chain; host networking does not, so these must be opened by
#      hand on the VPS — and the UDP ranges are the ones that actually carry
#      the audio, so a call that connects and then stays silent means these:
#
#        ufw allow 7880/tcp                # signalling — put TLS in front
#        ufw allow 7881/tcp                # RTC over TCP, the fallback
#        ufw allow 20000:20200/udp         # LiveKit media
#        ufw allow 10000:10200/udp         # SIP media, to and from Plivo
#
#      Port 5060 stays closed: we only dial out. Open it the day we take
#      inbound calls.
#
# A port already in use on the VPS now collides instead of being quietly
# remapped — the container fails to start with "address already in use", which
# is at least loud.
#
# On easypanel, add these as a compose service.

services:
  # State shared between the media server and the SIP bridge — and, less
  # obviously, where LiveKit keeps the SIP trunk. That is durable
  # configuration, not cache: this used to run with `--save "" --appendonly no`
  # and every redis restart silently dropped the trunk, after which the agent
  # failed each call with "requested sip trunk does not exist" until somebody
  # re-registered it. Appendonly keeps it across a restart.
  redis:
    image: redis:7-alpine
    # Two flags, both load-bearing on the host network.
    #
    # `--bind 127.0.0.1`: redis listens on every interface by default, and with
    # no container namespace around it that means the VPS's public IP — an
    # open, unauthenticated redis holding the SIP trunk. Only livekit and sip
    # talk to it and both are on this host, so loopback is all it needs.
    #
    # `--port 6399`: because sharing the host's network means sharing its
    # ports, and 6379 is the first port anything else on the box will have
    # taken. When that happens this container cannot bind and restarts in a
    # loop — but livekit and sip come up fine and quietly connect to whatever
    # redis *did* win 6379. They then find no SIP trunk there and every call
    # fails with `dial_failed`, while `docker ps` shows two healthy services
    # and one restarting. 6399 is ours alone.
    command: redis-server --bind 127.0.0.1 --port 6399 --appendonly yes --appendfsync everysec
    network_mode: host
    volumes:
      - redis-data:/data
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    environment:
      # "key: secret" — generate the secret yourself, minimum 32 characters.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    # 7880 signalling, 7881 RTC over TCP, 20000-20200/udp the audio itself.
    # Not published — see the header: they are opened on the VPS firewall now.
    network_mode: host
    depends_on:
      - redis
    restart: unless-stopped

  # The phone line. Screening calls only dial out, so this service opens the
  # connection to Plivo rather than waiting for one: the credentials sit on the
  # LiveKit outbound trunk and nothing here needs whitelisting. What it listens
  # on is in sip.yaml — 5060 for signalling and 10000-10200/udp for the audio.
  #
  # This is the service host networking matters most for: every packet of the
  # worker's voice, and of ours, crosses these RTP ports. The range stays
  # narrow anyway — 200 ports is 100 concurrent calls, far past what we will
  # ever place, and the same reasoning livekit.yaml applies to its ICE range.
  sip:
    image: livekit/sip:latest
    command: --config /etc/sip.yaml
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    volumes:
      - ./sip.yaml:/etc/sip.yaml:ro
    network_mode: host
    depends_on:
      - livekit
    restart: unless-stopped

  # The voice itself. Same image whether LiveKit is self-hosted or cloud — only
  # LIVEKIT_URL changes.
  #
  # On the host network too, and not only because `livekit` no longer resolves:
  # the agent publishes and subscribes real audio tracks, so it sits on the
  # media path exactly like the SIP bridge does. Left on the bridge it would
  # reach the media server over docker's NAT, and with `use_external_ip: true`
  # its own audio can end up taking a trip out to the public IP and back.
  agent:
    build:
      context: ../../services/screening-agent
    network_mode: host
    environment:
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_AGENT_NAME: screening-agent
      SCREENING_WEBHOOK_URL: ${SCREENING_WEBHOOK_URL}
      SCREENING_WEBHOOK_SECRET: ${SCREENING_WEBHOOK_SECRET}
      # Self-hosted has no inference gateway: every vendor is called directly
      # with our own key.
      SCREENING_SPEECH: plugins
      # Speech in and speech out both on Inworld — one account, one key, and the
      # cloned Hindi voice the script is tuned for. INWORLD_API_KEY is what
      # authenticates both; without it the container starts and has no voice.
      # Sarvam, not Inworld, for listening — the one place the two vendors
      # are not interchangeable. On the same line, to the same question,
      # Inworld returned "haan disturb hai" for "haan interested hain" and
      # turned a sentence into "kyunki itihaas wahin sparsh itihaas ke saare
      # hisse hain"; Sarvam returned "haan ji, kar sakta hoon" and read
      # "Morning 6 AM" back in English. A wrong transcript is worse than a
      # slow one: the model answers the words it was given, so an interested
      # worker was recorded as callback_later and the employer never saw them.
      #
      # saaras:v3, because the API now answers saarika:v2.5 with "is sunset,
      # please migrate". v4 exists but this plugin version does not know it.
      SCREENING_STT: ${SCREENING_STT:-sarvam/saaras:v3}
      SCREENING_TTS: ${SCREENING_TTS:-inworld/inworld-tts-1.5-max}
      INWORLD_API_KEY: ${INWORLD_API_KEY:-}
      # Sarvam is the A/B on Hindi, and also serves the LLM below.
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      # Deepgram/Cartesia are the alternative pair; set the two models above to
      # deepgram/nova-3 and cartesia/sonic-3 and fill these in instead.
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
      # The brain. DigitalOcean's llama-4-maverick, not Sarvam, and the reason
      # is latency spread rather than quality.
      #
      # A voice call cannot wait. Sarvam's 105b-conversations was measured at
      # ten identical requests three seconds apart: seven answered, three timed
      # out at twenty seconds, and of the ones that answered the median was
      # 0.39s but the slowest took 13s. On a phone that is a worker speaking
      # and then hearing nothing at all, which is exactly how it behaved live.
      # llama-4-maverick over the same ten: 10/10, median 1.67s, slowest 1.84s.
      # Slower in the middle, and that does not matter; what matters is that it
      # always answers and never stalls.
      #
      # It also calls tools, which is not optional — the agent hangs up by
      # calling end_call, and a model that cannot would hold every line open
      # until the 180s backstop.
      SCREENING_LLM: ${SCREENING_LLM:-openai/llama-4-maverick}
      SCREENING_LLM_BASE_URL: ${AI_BASE_URL:-https://inference.do-ai.run/v1}
      SCREENING_LLM_API_KEY: ${AI_KEY:-}
    depends_on:
      - livekit
    restart: unless-stopped

volumes:
  redis-data:
